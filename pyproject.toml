[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "marketpulse-research"
version = "1.0.0"
description = "Reproducible portfolio research and risk analytics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "statsmodels>=0.14,<0.15", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3", "sqlalchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "streamlit>=1.40,<2", "plotly>=5.24,<7", "httpx>=0.27,<1", "tabulate>=0.9,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "black>=24,<27", "mypy>=1.13,<2"]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.black]
target-version = ["py312"]
line-length = 100
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.poetry]
package-mode = false
